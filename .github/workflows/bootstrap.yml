name: Import CH347 Studio source and build APK
on:
  push:
    paths:
      - '.github/workflows/bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Restore complete Android Studio project
        run: bash scripts/restore-source.sh .

      - name: Publish readable Android source files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          # GITHUB_TOKEN may push source but cannot create/update workflow files.
          git reset --quiet HEAD -- .github/workflows/android.yml
          if ! git diff --cached --quiet; then
            git commit -m 'Import complete CH347 Studio Android project'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Run standalone protocol tests
        run: bash scripts/check-protocol.sh

      - name: Build and lint debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug :app:lintDebug

      - name: Give APK unique build filename
        if: success()
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/CH347Studio-debug-run${GITHUB_RUN_NUMBER}-attempt${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA:0:12}.apk"

      - name: Publish APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CH347Studio-debug-${{ github.run_number }}-${{ github.run_attempt }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30
